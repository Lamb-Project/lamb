  "USER_ROUTING": {
    "negative": "\\b(don't|do not|no|not|never|another|different|otro|otra|altre|altra)\\b",
    "read_only_constraints": [
      "\\b(do not|never) (create|edit|upload|delete|change|modify)[^.]*[.]?",
      "\\b(no writes|no changes|sin cambios|sense canvis)\\b"
    ],
    "assistant_id": "\\b(?:assistant|asistente|assistent)\\s+(\\d+)\\b",
    "facts": {
      "assistant": "\\b(assistant|asistente|assistent)\\b",
      "scenario": "\\b(scenarios?|escenarios?|escenaris?)\\b"
    },
    "rules": [
      {
        "skill": "manage-knowledge-base",
        "pattern": "\\b(knowledge bases?|kb|base de conocimiento|base de coneixement)\\b"
      },
      {
        "skill": "inspect-activity",
        "pattern": "\\b(activity|analytics|statistics|timeline|actividad|activitat|estadisticas|estadistiques)\\b",
        "requires_context": true
      },
      {
        "skill": "manage-rubric",
        "pattern": "\\b(rubric|rubrica|rubrics|rubriques)\\b"
      },
      {
        "skill": "create-assistant",
        "pattern": "\\b(create|crear|crea)\\b",
        "all_facts": [
          "assistant"
        ]
      },
      {
        "skill": "explain-assistant",
        "pattern": "\\b(explain|explica|properties|propiedades|propietats)\\b",
        "all_facts": [
          "assistant"
        ],
        "requires_context": true
      },
      {
        "skill": "improve-assistant",
        "pattern": "\\b(improve|edit|update|mejora|mejorar|editar|millora|millorar)\\b",
        "all_facts": [
          "assistant"
        ],
        "exclude_facts": [
          "scenario"
        ],
        "requires_context": true
      },
      {
        "skill": "test-and-evaluate",
        "pattern": "\\b(tests?|pruebas|proves|evaluate|evaluar|scenarios?|escenarios?|escenaris?)\\b",
        "any_facts": [
          "assistant",
          "linked_assistant"
        ],
        "requires_context": true
      },
      {
        "skill": "chat-with-assistant",
        "pattern": "\\b(chat with|talk to|hablar con|conversar)\\b",
        "all_facts": [
          "assistant"
        ],
        "requires_context": true
      },
      {
        "skill": "publish-assistant",
        "pattern": "\\b(publish|unpublish|publicar|publica|despublicar)\\b",
        "requires_context": true
      },
      {
        "skill": "about-lamb",
        "pattern": "\\b(how should i design|when should i use|single file or|should i use a rubric|como disenar|cuando usar|fitxer o|com dissenyar|quan conv[eé]|quin tipus de)\\b",
        "priority": 1
      },
      {
        "skill": "configure-agent",
        "pattern": "\\b(provider|providers|proveedor|proveedores|proveidor|proveidors|agent model|modelo del agente|model de l.agent|language fallback|idioma alternativo|llengua alternativa)\\b",
        "priority": 1
      }
    ]
  }
}
