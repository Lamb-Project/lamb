# Alembic configuration for the LAMB Library Manager.
#
# The database URL is NOT set here — env.py derives it from config.DB_PATH so
# the DATA_DIR env override (used by Docker and tests) stays authoritative.

[alembic]
# Migration scripts live in backend/migrations (deliberately NOT named
# "alembic" so the directory cannot shadow the installed alembic package on
# sys.path).
script_location = migrations
prepend_sys_path = .

# Use a stable, sortable file naming scheme.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
