# Workflow: deploy a release tag to test.lamb-project.org and run Playwright

name: Remote deploy on tag

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: remote-deploy
  cancel-in-progress: false

jobs:
  ssh-deploy:
    name: SSH deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure known_hosts has the server
        run: |
          mkdir -p $HOME/.ssh
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> $HOME/.ssh/known_hosts

      - name: Execute remote commands via SSH
        uses: appleboy/ssh-action@v0.1.7
        env:
          DEPLOY_REF: ${{ github.ref_name }}
          DEPLOY_REF_TYPE: ${{ github.ref_type }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 45m
          envs: DEPLOY_REF,DEPLOY_REF_TYPE
          script: |
            set -e
            cd /opt/lamb-test
            git fetch --prune --tags --force origin
            PREVIOUS_HEAD=$(git rev-parse HEAD)

            # Tag pushes deploy exactly that tag, which must already be on dev;
            # manual runs deploy the selected branch.
            if [ "$DEPLOY_REF_TYPE" = "tag" ]; then
              if ! git merge-base --is-ancestor "refs/tags/$DEPLOY_REF" origin/dev; then
                echo "Tag $DEPLOY_REF is not on origin/dev; refusing to deploy it."
                exit 1
              fi
              git checkout --quiet --detach "refs/tags/$DEPLOY_REF"
            else
              git checkout --quiet "$DEPLOY_REF"
              git merge --ff-only "origin/$DEPLOY_REF"
            fi
            echo "Deployed $(git log --oneline -1)"

            # Containers only install requirements when they start, so recreate
            # the ones whose dependencies changed. The backend is always
            # recreated: it was the service most often left half-updated.
            RECREATE="backend"
            changed() { ! git diff --quiet "$PREVIOUS_HEAD" HEAD -- "$@"; }
            changed lamb-kb-server-stable/backend/requirements.txt && RECREATE="$RECREATE kb"
            changed open-webui/backend/requirements.txt && RECREATE="$RECREATE openwebui"
            changed library-manager/pyproject.toml && RECREATE="$RECREATE library-manager"

            echo "Starting Docker services (recreating: $RECREATE)..."
            docker compose up -d 2>&1
            docker compose up -d --force-recreate --no-deps $RECREATE 2>&1

            # Wait for the backend to become healthy (max 10 minutes).
            echo "Waiting for backend to become healthy..."
            BACKEND_READY=false
            for i in $(seq 1 60); do
              STATUS=$(curl -s --max-time 5 -o /dev/null -w "%{http_code}" \
                http://localhost:7099/creator/login \
                -X POST -d "email=nobody" -d "password=nobody" 2>/dev/null || echo "000")
              if [ "$STATUS" = "200" ] || [ "$STATUS" = "400" ]; then
                echo "Backend is responding (HTTP $STATUS)."
                BACKEND_READY=true
                break
              fi
              echo "  attempt $i/60: backend returned HTTP $STATUS, waiting..."
              sleep 10
            done
            if [ "$BACKEND_READY" != "true" ]; then
              echo "Backend did not become healthy; last log lines:"
              docker compose logs --tail 50 backend 2>&1
              exit 1
            fi

            cd testing/playwright

            # Ensure nvm (and node/npm installed via nvm) is loaded for non-interactive SSH sessions
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            fi

            # Diagnostics to help debug missing npm in CI
            echo "Remote user: $(whoami)"
            echo "Remote HOME: $HOME"
            echo "Remote PATH: $PATH"
            command -v npm && echo "npm found at: $(command -v npm)" || echo "npm not found"
            command -v node && echo "node found at: $(command -v node)" || echo "node not found"

            # Run tests but keep the exit code so we can always collect the HTML report
            # Always exercise the public test deployment. The report host keeps
            # its own untracked Playwright .env, which must not silently select
            # a different LAMB instance.
            PLAYWRIGHT_BASE_URL="https://test.lamb-project.org"
            echo "Running Playwright against: $PLAYWRIGHT_BASE_URL"

            # temporarily exclude known-flaky / environment-disabled tests using grep-invert.
            # patterns should match the test names (case‑sensitive).  Remove the
            # `--grep-invert` flag when the tests are fixed so they run again.
            # - Library Manager: disabled in test env (LAMB_LIBRARY_SERVER_ENABLE=DISABLE)
            # - YouTube video titles: requires a pre-existing seeded KB with an
            #   Edit button; not present in the ephemeral test env.
            # - Disable test users (#14): pre-existing clickability issue in the
            #   admin sharing serial chain — the Disable button resolves but the
            #   click is intercepted for the full 90s timeout. Needs separate fix.
            set +e
            BASE_URL="$PLAYWRIGHT_BASE_URL" FORCE_RELOGIN=true npx playwright test \
              --grep-invert "Moodle LTI integration|Organization Without Admin & Role Promotion|URL ingestion and query verification|Library Manager integration|YouTube video titles are descriptive|Disable test users"
            TEST_EXIT_CODE=$?
            set -e

            REPORT_SRC=playwright-report
            DEST_ROOT=/var/www/playwright/html

            if [ -d "$REPORT_SRC" ]; then
              TIMESTAMP=$(date -u +"%Y%m%dT%H%M%SZ")
              DEST="$DEST_ROOT/$TIMESTAMP"

              # Try creating and copying without sudo first, fall back to sudo if needed
              mkdir -p "$DEST" || sudo mkdir -p "$DEST"
              cp -r "$REPORT_SRC"/* "$DEST"/ || sudo cp -r "$REPORT_SRC"/* "$DEST"/

              # Update 'latest' symlink (atomic)
              ln -sfn "$DEST" "$DEST_ROOT/latest" || sudo ln -sfn "$DEST" "$DEST_ROOT/latest"

              echo "Playwright report deployed at: https://playwright.lamb-project.org/latest/index.html"
              echo "Archive: https://playwright.lamb-project.org/$TIMESTAMP/index.html"

              # Cleanup old archives older than 7 days
              if [ -d "$DEST_ROOT" ]; then
                echo "Cleaning up Playwright reports in $DEST_ROOT older than 7 days..."
                find "$DEST_ROOT" -maxdepth 1 -mindepth 1 -type d -name '2*' -mtime +7 -print -exec rm -rf {} \;
              fi
            else
              echo "Playwright report not found in $REPORT_SRC"
            fi

            # Fail the job if tests failed
            exit $TEST_EXIT_CODE
