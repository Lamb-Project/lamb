services:
  qdrant-test:
    image: qdrant/qdrant:v1.11.0
    container_name: kbs-test-qdrant
    ports:
      - "${QDRANT_TEST_PORT:-6333}:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /qdrant/storage
